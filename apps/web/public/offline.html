<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Offline — Acme CRM</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --card: #fff; --line: #e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --fg: #f1f5f9; --muted: #94a3b8; --card: #111827; --line: #1f2937; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 22rem; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 1.15rem; margin: 16px 0 6px; }
    p { margin: 0 0 18px; color: var(--muted); font-size: .9rem; line-height: 1.45; }
    button { font: inherit; font-weight: 600; color: #fff; background: #4f46e5; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You’re offline</h1>
    <p>The CRM needs an internet connection to show your customers, deals and chats. It opens again as soon as you’re back online.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
