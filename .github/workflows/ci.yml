name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://crm:crm@localhost:5432/crm_test
      E2E_DATABASE_URL: postgres://crm:crm@localhost:5432/crm_e2e
      DATABASE_URL: postgres://crm:crm@localhost:5432/crm_e2e
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create e2e database
        run: PGPASSWORD=crm psql -h localhost -U crm -d crm_test -c "CREATE DATABASE crm_e2e"
      - run: npm ci
      - run: npm run audit   # production deps: 0 advisories; dev tools: only allowlisted ones (audit-allowlist.json)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The production image: builds, starts against PostgreSQL, runs its migrations and answers the health check.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t acme-crm .
      - name: Start it with PostgreSQL and check health
        run: |
          docker network create crm
          docker run -d --name db --network crm -e POSTGRES_USER=crm -e POSTGRES_PASSWORD=crm -e POSTGRES_DB=crm postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U crm -d crm && break; sleep 2; done
          docker run -d --name app --network crm -p 3000:3000 -e DATABASE_URL=postgres://crm:crm@db:5432/crm \
            -e APP_URL=https://crm.example.com -e SECRETS_KEY=$(openssl rand -base64 32) acme-crm
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:3000/api/v1/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/v1/health
          curl -fsS http://127.0.0.1:3000/ | grep -q '<title>'
          test "$(docker inspect -f '{{.State.Health.Status}}' app)" != unhealthy
      - name: Logs on failure
        if: failure()
        run: docker logs app || true
